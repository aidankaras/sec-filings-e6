name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "10 13 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Supplied so configuration validation can run without repository secrets.
  SEC_USER_AGENT: "arbiter-ci ci@example.com"

# Every action below is pinned to a commit, with its tag in a trailing comment.
# A tag is a movable pointer: the code that ran last week under `@v6` is not
# necessarily the code that runs today. Each SHA is resolved from the upstream
# repository at the time it is written, never copied from another workflow.
jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing -m "not integration"

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Audit dependencies for known vulnerabilities
        # Audits the exported dependency set rather than the installed
        # environment, because the project itself is not published to PyPI and
        # cannot be resolved.
        #
        # Local version identifiers are stripped before auditing. Torch resolves
        # to a `+cpu` wheel that exists only on the PyTorch index, and advisories
        # are published against the upstream version regardless.
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes \
            --format requirements-txt -o requirements-export.txt
          sed -E 's/^([A-Za-z0-9._-]+==[0-9][^+ ]*)\+[A-Za-z0-9.]+/\1/' \
            requirements-export.txt > requirements-audit.txt
          uvx pip-audit --no-deps --requirement requirements-audit.txt

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The scan below reads every commit, so the full history has to be
          # present. A shallow checkout would silently narrow it to one commit.
          fetch-depth: 0

      - name: Scan every commit for secrets
        # gitleaks is invoked directly rather than through its action, which
        # derives a scan range from the push event and passes it as `--log-opts`.
        # That range is the commits in the push: on a representative run this job
        # read 2 commits and 11 KB while the repository held 49 commits and 1.08
        # MB, so it reported "no leaks detected" having never looked at 98% of the
        # history. A secret committed before this job existed, or on any push
        # whose range excluded it, would stay green forever — a check that passes
        # for a reason unrelated to what it claims to verify.
        #
        # The release archive is pinned by digest, not by tag, for the same reason
        # the actions above are: the scanner runs before anything else has
        # inspected the tree, so its own provenance has to be the one thing not
        # taken on trust.
        #
        # The first run of this step read 69 commits and 860 KB. That figure is
        # recorded because a green from a scan that read everything and a green
        # from one that read nothing are the same word on the summary page, and
        # the difference is only visible in a log that expires.
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

          # `detect --source .` walks the whole commit graph. No --log-opts: any
          # narrowing here is the defect this step was rewritten to remove.
          ./gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Publish the findings when the scan fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gitleaks-findings
          path: gitleaks.sarif
          if-no-files-found: ignore

  container:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The default docker driver cannot export a build cache. buildx provides
      # the docker-container driver that the GitHub Actions cache backend needs.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
