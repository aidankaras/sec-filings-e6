# Runs what CI runs: Ruff (pinned to the version in uv.lock), strict Pyright,
# the unit suite, and gitleaks (the version CI downloads). Keep the revs below
# in step with uv.lock and GITLEAKS_VERSION in .github/workflows/ci.yml.
# Pyright and pytest run through `uv run`, so they use the locked environment.
# The vendored git-signoff skill and its records are kept byte-identical.
exclude: ^(\.claude/skills/git-signoff/|\.git-signoff/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (unit)
        entry: uv run pytest -q -m "not integration"
        language: system
        types: [python]
        pass_filenames: false
